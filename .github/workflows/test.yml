name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
      - name: Fmt
        run: |
          unformatted="$(go fmt ./...)"
          if [ -n "$unformatted" ]; then
            echo "Go code is not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
